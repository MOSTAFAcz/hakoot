{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">Join QuizBattle</h2>

            <form method="POST">
                <input
                    name="room_code"
                    class="form-control mb-3 text-center"
                    placeholder="ROOM CODE"
                    maxlength="6"
                    required
                >

                <input
                    name="nickname"
                    class="form-control mb-3"
                    placeholder="Your nickname"
                    maxlength="30"
                    required
                >

                <button class="btn btn-success w-100">
                    Join Game
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
